<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cape Town, South Africa — Night Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body style="--accent-hue: 35;">

  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-glyph">✦</div>
      <p class="lock-title">Enter the access code</p>
      <p class="lock-subtitle">This sky belongs to one of five locations.<br>You'll need the code you were given for this one.</p>
      <form id="code-form" autocomplete="off">
        <input id="code-input" type="text" placeholder="Access code" autocapitalize="off" spellcheck="false">
        <button type="submit">Unlock the sky</button>
      </form>
      <p class="lock-error" id="code-error"></p>
    </div>
  </div>

  <div id="app" class="app">
    <canvas id="sky"></canvas>
    <div class="hud">
      <p class="hud-place" id="place-name">Cape Town, South Africa</p>
      <p class="hud-line" id="place-coords"></p>
      <p class="hud-line" id="place-time"></p>
      <p class="hud-line" id="star-count-line">Stars above the horizon right now: <span id="star-count"></span></p>
    </div>
    <div class="hud-hint">One of five skies, same moment in time</div>
  </div>

  <script src="assets/stars-data.js"></script>
  <script src="assets/observation-time.js"></script>
  <script src="assets/starmap.js"></script>
  <script>
    const PAGE_CONFIG = {
      placeName: "Cape Town, South Africa",
      lat: -33.9249,
      lon: 18.4241,
      accessCodeHash: "85c9bea009c00fe40bfb9172054c65ac0c6486517f8bd19212d28ff91ec19592",
    };
    setupLockScreen(PAGE_CONFIG);
  </script>
</body>
</html>
